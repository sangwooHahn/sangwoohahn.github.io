<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafafa">
  <title data-key="Title"></title>

  <!-- 링크 미리보기용 메타 태그 -->
  <meta property="og:title" content="" data-key="Link_Title">
  <meta property="og:description" content="" data-key="Link_Description">
  <meta property="og:image" content="https://sangwoohahn.com/assets/images/thumbnail-EN.png">
  <meta property="og:url" content="https://sangwoohahn.com/JennyMyWife">
  <meta property="og:type" content="website">

  <!-- Font-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">

  <link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">

  <!-- MapTiler(Map) SDK CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js"></script>
  <script src="https://unpkg.com/ol-mapbox-style@12.1.1/dist/olms.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/wedding.css">

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://kit.fontawesome.com/1af5f92f3d.js" crossorigin="anonymous"></script>
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

  <main>
    <section class="title-module">
      <img src="assets/images/wedding/title_text.webp" class="title-text">
      <img src="assets/images/wedding/title-date.webp" class="title-date">
      <img src="assets/images/wedding/title_flower_1.webp" class="title-flower-01">
      <img src="assets/images/wedding/title_flower_2.webp" class="title-flower-02">
      <img src="assets/images/wedding/title_flower_3.webp" class="title-flower-03">
      <img src="assets/images/wedding/title_flower_4.webp" class="title-flower-04">
      <img src="assets/images/wedding/title_flower_5.webp" class="title-flower-05">
      <img src="assets/images/wedding/title_flower_leaf_1.webp" class="title-flower-leaf-01">
      <img src="assets/images/wedding/title_flower_leaf_2.webp" class="title-flower-leaf-02">
      <img src="assets/images/wedding/title_flower_leaf_3.webp" class="title-flower-leaf-03">
      <img src="assets/images/wedding/title_flower_leaf_4.webp" class="title-flower-leaf-04">
      <img src="assets/images/wedding/title_flower_leaf_5.webp" class="title-flower-leaf-05">
      <div class="name-container">
        <div class="photo-groom">
          <img src="assets/images/wedding/photo-groom.webp">
          <p class="parent-text" data-key="Name_Groom_Parent"></p>
          <p class="name-text" data-key="Name_Groom"></p>
        </div>
        <div class="photo-bride">
          <img src="assets/images/wedding/photo-bride.webp">
          <img class="flower-leaf" src="assets/images/wedding/flower-leaf.webp">
          <p class="parent-text" data-key="Name_Bride_Parent"></p>
          <p class="name-text" data-key="Name_Bride"></p>
        </div>
      </div>
      <img class="flower-01" src="assets/images/wedding/flower-01.webp">
      <img src="assets/images/wedding/ring.webp" class="title-ring">
      <img src="assets/images/wedding/shine.webp" class="title-shine">
      <div class="intro-text">
        <p data-key="Intro"></p>
      </div>
      <div class="background-patttern"></div>
    </section>

    <section class="date-module">
      <div>
        <div class="date-container">
          <p class="date-text" data-key="Date"></p>
          <p class="time-text" data-key="Time"></p>
          <p class="location-text" data-key="Location"></p>
        </div>
        <div>
          <div class="calendar-container">
            <!-- 요일 헤더 -->
            <div class="dow sun" data-key="Sun"></div>
            <div class="dow" data-key="Mon"></div>
            <div class="dow" data-key="Tue"></div>
            <div class="dow" data-key="Wed"></div>
            <div class="dow" data-key="Thu"></div>
            <div class="dow" data-key="Fri"></div>
            <div class="dow sat" data-key="Sat"></div>

            <!-- 날짜: 2026-01-01은 목요일 → 첫 번째 날짜 칸에 grid-column-start:5 -->
            <div class="day" style="grid-column-start:5"><span>1</span></div>
            <div class="day"><span>2</span></div>
            <div class="day sat"><span>3</span></div>

            <div class="day sun"><span>4</span></div>
            <div class="day"><span>5</span></div>
            <div class="day"><span>6</span></div>
            <div class="day"><span>7</span></div>
            <div class="day"><span>8</span></div>
            <div class="day"><span>9</span></div>
            <div class="day sat"><span>10</span></div>

            <div class="day sun"><span>11</span></div>
            <div class="day"><span>12</span></div>
            <div class="day"><span>13</span></div>
            <div class="day"><span>14</span></div>
            <div class="day"><span>15</span></div>
            <div class="day"><span>16</span></div>
            <div class="day sat"><span>17</span></div>

            <div class="day sun"><span>18</span></div>
            <div class="day"><span>19</span></div>
            <div class="day"><span>20</span></div>
            <div class="day"><span>21</span></div>
            <div class="day"><span>22</span></div>
            <div class="day"><span>23</span></div>
            <div class="day sat d-day">
              <span>24</span>
              <svg>
                <use xlink:href="#icon_heart"></use>
              </svg>
            </div>

            <div class="day sun"><span>25</span></div>
            <div class="day"><span>26</span></div>
            <div class="day"><span>27</span></div>
            <div class="day"><span>28</span></div>
            <div class="day"><span>29</span></div>
            <div class="day"><span>30</span></div>
            <div class="day sat"><span>31</span></div>
          </div>
        </div>
      </div>
      <button id="add-to-calendar" class="pill-button" data-key="Button_Calendar"></button>
      <img class="flower-02" src="assets/images/wedding/flower-02.webp">
    </section>

    <section class="gallery-module">
      <div class="images" id="thumbnailTrack">
        <img src="assets/images/wedding/gallery_image_1.png" data-index="0">
        <img src="assets/images/wedding/gallery_image_2.png" data-index="1">
        <img src="assets/images/wedding/gallery_image_3.png" data-index="2">
        <img src="assets/images/wedding/gallery_image_4.png" data-index="3">
        <img src="assets/images/wedding/gallery_image_5.png" data-index="4">
      </div>

      <div class="indicator-wrapper">
        <button class="prev"></button>
        <div class="indicator">
          <span data-index="0"></span>
          <span data-index="1"></span>
          <span data-index="2"></span>
          <span data-index="3"></span>
          <span data-index="4"></span>
        </div>
        <button class="next"></button>
      </div>
      <img class="flower-03" src="assets/images/wedding/flower-03.webp">
    </section>

    <div class="lightbox" style="display: none">
      <button class="close"></button>
      <img class="lightbox-image" src="" alt="Full View">
      <div class="arrow-wrapper">
        <button class="prev"></button>
        <button class="next"></button>
      </div>
    </div>

    <section class="map-module" id="location-section">
      <h2 data-key="Location_Title"></h2>
      <div>
        <div class="map-text-container">
          <div>
            <p class="location-text" data-key="Location"></p>
            <p class="address-text" data-key="Address"></p>
          </div>

          <div class="transportation-info">
            <div class="transportation-item">
              <svg>
                <use xlink:href="#icon_car"></use>
              </svg>
              <p class="transportation-text" data-key="Parking"></p>
            </div>

            <div class="transportation-item">
              <svg>
                <use xlink:href="#icon_bus"></use>
              </svg>
              <p class="transportation-text" data-key="Bus"></p>
            </div>
          </div>
        </div>

        <div class="map-container">
          <div class="map-wrapper">
            <div id="map"></div>
          </div>

          <div class="map-links">
            <a id="naver-map-link" target="_blank">
              <svg>
                <use xlink:href="#icon_naver"></use>
              </svg>
              <span data-key="Map_Naver"></span>
            </a>
            <a id="kakao-navi-link" target="_blank">
              <svg>
                <use xlink:href="#icon_kakao"></use>
              </svg>
              <span data-key="Map_Kakao"></span>
            </a>
            <a id="tmap-link" target="_blank">
              <svg>
                <use xlink:href="#icon_tmap"></use>
              </svg>
              <span data-key="Map_Tmap"></span>
            </a>
            <a id="google-link" target="_blank">
              <svg>
                <use xlink:href="#icon_google"></use>
              </svg>
              <span data-key="Map_Google"></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="dresscode-module">
      <h2 data-key="DressCode_Title"></h2>
      <div class="dresscode-container">
        <p data-key="DressCode"></p>
        <div class="color-container">
          <div style="background-color: #B267E8;"></div>
          <div style="background-color: #ACB001;"></div>
          <div style="background-color: #F383FF;"></div>
          <div style="background-color: #FBB040;"></div>
        </div>
      </div>
      <img class="flower-04" src="assets/images/wedding/flower-04.webp">
    </section>

    <div class="cropped-wrapper">
      <img class="cropped-image" src="assets/images/wedding/divider_image_1.png" alt="Divider">
    </div>

    <section class="RSVP-module">
      <div>
        <div>
          <h2 data-key="RSVP_Title"></h2>
          <p data-key="RSVP_Instruction"></p>
        </div>

        <form id="rsvpForm_module"
          action="https://script.google.com/macros/s/AKfycbwuT2SWQg33Xz50BV5L5TUVdGeGGbOFO2KRxiAJDJjBo0wKI5juw-D_Y49SLS3EY97S/exec"
          method="GET" target="hidden_iframe">

          <div class="tab-buttons">
            <button type="button" class="tab-button button-groom active" data-tab="groom"
              data-key="RSVP_Groom"></button>
            <button type="button" class="tab-button button-bride" data-tab="bride" data-key="RSVP_Bride"></button>
          </div>

          <div class="input-container">
            <input name="guestName" id="nameInput_module" data-key-placeholder="RSVP_Name" required />
            <input name="companionName" id="companionNameInput_module" data-key-placeholder="RSVP_Guest_Name" />
            <input name="attending" id="attendingInput_module" type="hidden" />
            <input name="side" id="sideInput_module" type="hidden" />
          </div>

          <div class="button-container">
            <button class="pill-button pill-button-fill button-attend" type="button" onclick="submitFormModule(true)">
              <svg>
                <use xlink:href="#icon_check"></use>
              </svg>
              <span data-key="RSVP_Attend"></span>
            </button>
            <button class="pill-button pill-button-fill button-absence" type="button" onclick="submitFormModule(false)">
              <svg>
                <use xlink:href="#icon_cross"></use>
              </svg>
              <span data-key="RSVP_Absence"></span>
            </button>
          </div>
        </form>
      </div>
      <iframe name="hidden_iframe" style="display:none;"></iframe>
    </section>

    <section class="message-module">
      <h2 data-key="Message_Title"></h2>

      <div class="message-container">
        <div class="message-list-container">
          <div id="messageList" class="message-list">
            <!-- JS에서 메시지 목록 삽입 -->
          </div>
        </div>


        <div class="writing-container hidden" id="messageSection">
          <div class="input-container">
            <input id="messageNameInput" type="text" data-key-placeholder="Message_Name" required />

            <textarea id="messageContentInput" maxlength="300" data-key-placeholder="Message_Content"
              required></textarea>

          </div>
          <button type="button" onclick="submitMessage()" class="pill-button pill-button-fill"
            data-key="Button_SendMessage"></button>
        </div>

        <!-- 글 작성 보이기 버튼 - 모바일용 -->
        <button id="showMessageBtn" class="pill-button" data-key="Message_ShowButton"></button>
        <img class="flower-05" src="assets/images/wedding/flower-05.webp">
      </div>

    </section>

    <div class="last-image-wrapper">
      <img class="last-image" src="assets/images/wedding/divider_image_2.png">
    </div>

    <section class="footer-module">
      <div>
        <button class="pill-button" onclick="showContactModal()">
          <svg>
            <use xlink:href="#icon_phone"></use>
          </svg>
          <span data-key="Button_Contact"></span>
        </button>
        <button class="pill-button" onclick="showAccountModal()">
          <svg>
            <use xlink:href="#icon_heartbox"></use>
          </svg>
          <span data-key="Button_Account"></span>
        </button>
        <button id="share-kakao" class="pill-button pill-button-fill">
          <svg>
            <use id="icon-share-1" xlink:href="#icon_share"></use>
            <use id="icon-share-2" xlink:href="#icon_share2"></use>
          </svg>
          <span data-key="Button_Share"></span>
        </button>
      </div>
    </section>

    <footer>
      <div>
        <p data-key="Footer_Text"></p>
        <p data-key="Footer_Copyright"></p>
      </div>
      <button id="icon-setting">
        <svg>
          <use xlink:href="#icon_setting"></use>
        </svg>
      </button>
    </footer>


    <!-- 숨겨진 메시지 span -->
    <span id="alert-name-required" data-key="RSVP_Alert_Name" style="display:none;"></span>
    <span id="alert-success" data-key="RSVP_Alert_Success" style="display:none;"></span>
    <span id="alert-wait-text" data-key="RSVP_Alert_Wait" style="display:none;"></span>
    <span id="alert-message-wait" data-key="Message_Alert_Wait" style="display:none;"></span>
    <span id="alert-message-success" data-key="Message_Alert_Success" style="display:none;"></span>
    <span id="alert-message-required" data-key="Message_Alert_Content" style="display:none;"></span>

    <!-- 커스텀 연락처 모달 -->
    <div class="contact-modal custom-modal hidden">
      <div class="contact-container custom-modal-content">
        <h2 data-key="Contact_Title"></h2>

        <div class="contact-tabs" role="tablist">
          <button class="contact-tab active" data-key="Side_Groom" data-tab="groom" role="tab"
            aria-selected="true"></button>
          <button class="contact-tab" data-key="Side_Bride" data-tab="bride" role="tab" aria-selected="false"></button>
        </div>

        <div class="contact-panels">
          <!-- 신랑측 -->
          <div class="contact-panel active" data-tab="groom" role="tabpanel">
            <div class="contact-card contact-groom-kr">
              <span data-key="Name_Groom_KR"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Groom_KR">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Groom_KR">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div class="contact-card contact-groom-us">
              <span data-key="Name_Groom_US"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Groom_US">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Groom_US">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div class="contact-card">
              <span data-key="Name_Father_Groom"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Father_Groom">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Father_Groom">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div class="contact-card">
              <span data-key="Name_Mother_Groom"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Mother_Groom">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Mother_Groom">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- 신부측 -->
          <div class="contact-panel" data-tab="bride" role="tabpanel">

            <div class="contact-card contact-bride-kr">
              <span data-key="Name_Bride_KR"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Bride_KR">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Bride_KR">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div class="contact-card contact-bride-us">
              <span data-key="Name_Bride_US"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Bride_US">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Bride_US">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div class="contact-card">
              <span data-key="Name_Father_Bride"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Father_Bride">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Father_Bride">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div class="contact-card">
              <span data-key="Name_Mother_Bride"></span>
              <div class="contact-buttons">
                <button class="contact-button sms-button" data-phone-key="Phone_Mother_Bride">
                  <svg>
                    <use xlink:href="#icon_message"></use>
                  </svg>
                </button>
                <button class="contact-button phone-button" data-phone-key="Phone_Mother_Bride">
                  <svg>
                    <use xlink:href="#icon_phone"></use>
                  </svg>
                </button>
              </div>
            </div>

          </div>
        </div>
        <!-- <button class="pill-button pill-button-fill close-btn" data-key="Button_Close"></button> -->
      </div>
    </div>

    <!-- 커스텀 계좌번호 모달 -->
    <div class="account-modal custom-modal hidden">
      <div class="account-container custom-modal-content">
        <h2 data-key="Account_Title"></h2>

        <div class="account-tabs" role="tablist">
          <button class="account-tab active" data-key="Side_Groom" data-tab="groom" role="tab"
            aria-selected="true"></button>
          <button class="account-tab" data-key="Side_Bride" data-tab="bride" role="tab" aria-selected="false"></button>
        </div>

        <div class="account-panels">
          <!-- 신랑측 -->
          <div class="account-panel active" data-tab="groom" role="tabpanel">

            <div class="venmo-card">
              <span class="venmo-name" data-key="Venmo_Groom"></span>

              <button class="venmo-button" data-account-key="Venmo_Link_Groom">
                <svg>
                  <use xlink:href="#icon_venmo"></use>
                </svg>
              </button>
            </div>

            <div>
              <span class="account-name" data-key="Name_Groom"></span>
              <div class="account-card">
                <div class="account-num">
                  <span class="bank-name" data-key="Bank_Groom"></span>
                  <span data-key="Account_Groom"></span>
                </div>

                <button class="account-button" data-account-key="Account_Groom">
                  <svg>
                    <use xlink:href="#icon_copy"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div>
              <span class="account-name" data-key="Name_Father_Groom"></span>
              <div class="account-card">
                <div class="account-num">
                  <span class="bank-name" data-key="Bank_Father_Groom"></span>
                  <span data-key="Account_Father_Groom"></span>
                </div>

                <button class="account-button" data-account-key="Account_Father_Groom">
                  <svg>
                    <use xlink:href="#icon_copy"></use>
                  </svg>
                </button>
              </div>
            </div>

            <div>
              <span class="account-name" data-key="Name_Mother_Groom"></span>
              <div class="account-card">
                <div class="account-num">
                  <span class="bank-name" data-key="Bank_Mother_Groom"></span>
                  <span data-key="Account_Mother_Groom"></span>
                </div>

                <button class="account-button" data-account-key="Account_Mother_Groom">
                  <svg>
                    <use xlink:href="#icon_copy"></use>
                  </svg>
                </button>
              </div>
            </div>

          </div>

          <!-- 신부측 -->
          <div class="account-panel" data-tab="bride" role="tabpanel">

            <div class="venmo-card">
              <span class="venmo-name" data-key="Venmo_Bride"></span>

              <button class="venmo-button" data-account-key="Venmo_Link_Bride">
                <svg>
                  <use xlink:href="#icon_venmo"></use>
                </svg>
              </button>
            </div>

            <div>
              <span class="account-name" data-key="Name_Bride"></span>
              <div class="account-card">
                <div class="account-num">
                  <span class="bank-name" data-key="Bank_Bride"></span>
                  <span data-key="Account_Bride"></span>
                </div>

                <button class="account-button" data-account-key="Account_Bride">
                  <svg>
                    <use xlink:href="#icon_copy"></use>
