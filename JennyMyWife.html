  <main>
    <h1>Happy Wedding!</h1>
    <h2>Sangwoo & Jenny Wedding!</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3k8QD2Ty9XCxSBUucxssdkV8aolbj2vrQlw&s">


    <h2>RSVP</h2>
    <div>
      <input id="nameInput" placeholder="성함을 입력해 주세요" />
      <button onclick="submitRSVP(true)">참석합니다</button>
      <button onclick="submitRSVP(false)">불참합니다</button>
    </div>

  </main>

  <script>
    function submitRSVP(isAttending) {
      const guestName = document.getElementById("nameInput").value;

      fetch("https://script.google.com/macros/s/AKfycbyH9guMuhbt7gff0W_LLA0YJ-4IRmaBKZk_vM2DPBa8LiQgUBBkBWSSK3XZP1NErZ0/exec", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ guestName, attending: isAttending })
      })
        .then(res => {
          if (res.ok) {
            alert("응답이 기록되었습니다. 감사합니다!");
          } else {
            alert("오류가 발생했습니다. 다시 시도해주세요.");
          }
        });
    }
  </script>
