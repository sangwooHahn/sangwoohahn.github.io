  <style>

<body>

  <main>
    <h1>Happy Wedding!</h1>
    <h2>Sangwoo & Jenny Wedding!</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3k8QD2Ty9XCxSBUucxssdkV8aolbj2vrQlw&s">


    <form action="https://script.google.com/macros/s/AKfycbyH9guMuhbt7gff0W_LLA0YJ-4IRmaBKZk_vM2DPBa8LiQgUBBkBWSSK3XZP1NErZ0/exec" method="GET" target="hidden_iframe">
      <input name="guestName" id="nameInput" placeholder="성함을 입력해 주세요" required />
      <input type="hidden" name="attending" id="attendingInput" />
      <button type="button" onclick="submitForm(true)">참석합니다</button>
      <button type="button" onclick="submitForm(false)">불참합니다</button>
    </form>
    <iframe name="hidden_iframe" style="display:none;"></iframe>

  </main>

  <script>
    function submitForm(isAttending) {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('성함을 입력해주세요.');
        return;
      }
      document.getElementById('attendingInput').value = isAttending ? 'yes' : 'no';
      document.forms[0].submit();
      alert('응답이 기록되었습니다. 감사합니다!');
    }
  </script>

</body>
