<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Wedding Gallery</title>
  <style>
    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .thumb {
      width: 120px;
      height: 120px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>Wedding Photo Upload</h2>

  <form id="uploadForm">
    <input type="file" id="files" multiple accept="image/*,video/*">
    <button type="submit" id="uploadBtn">Upload</button>
  </form>


  <div id="status"></div>
  <div id="gallery"></div>

  <script>
    // ✨ SCRIPT_URL을 실제 배포한 Apps Script URL로 변경해야 합니다.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzltMrImaxIvd8n5hAkJYwADnJRMoLfO9HzBTCL7HKUzcRXx7fccoLv2dVENKL8me7BBQ/exec';
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const gallery = document.getElementById('gallery');

    document.getElementById('uploadForm').addEventListener('submit', async e => {
      e.preventDefault();
      const input = document.getElementById('files');
      const files = Array.from(input.files);
      if (!files.length) return alert('No files selected');

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';
      status.textContent = `Uploading ${files.length} file(s)...`;

      try {
        // Prepare payload
        const payload = [];
        for (const file of files) {
          // FileReader로 파일을 Base64로 인코딩
          const base64 = await toBase64(file);
          payload.push({ name: file.name, type: file.type, data: base64 });
        }

        // Send to Apps Script
        const formData = new FormData();
        formData.append('files', JSON.stringify(payload));
        const res = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
        const json = await res.json();

        if (json.success) {
          status.textContent = `Upload complete: ${json.count} file(s)`;
          loadGallery(); // Refresh gallery
        } else {
          status.textContent = `Upload failed: ${json.message}`;
        }

      } catch (err) {
        console.error(err);
        status.textContent = `Upload error: ${err}`;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });

    function toBase64(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });
    }

    // Load gallery from Apps Script
    // Load gallery from Apps Script
    async function loadGallery() {
      gallery.innerHTML = '';
      try {
        const res = await fetch(`${SCRIPT_URL}?action=list`);
        const json = await res.json();
        if (!json.files) return;

        json.files.forEach(f => {
          // Apps Script에서 보낸 directLink 필드를 사용합니다.
          if (f.type === 'photo' && f.directLink) {
            const img = document.createElement('img');

            // 🚀 최종 클라이언트 수정:
            // 1. thumbnailLink가 있다면 그대로 사용합니다 (가장 안전).
            let imgSrc = f.directLink;

            // 2. 만약 Apps Script가 thumbnailLink를 반환하지 못했다면 (오류 시), 
            //    최후의 수단으로 일반 uc?id 링크를 시도합니다.
            if (!imgSrc) {
              imgSrc = `https://drive.google.com/uc?id=${f.id}`;
            }

            img.src = imgSrc;

            img.alt = f.name;
            img.className = 'thumb';
            img.title = f.name;

            // ... (클릭 이벤트 유지)
            img.onclick = () => window.open(`https://drive.google.com/file/d/${f.id}/preview`, '_blank');

            gallery.appendChild(img);
          }
        });

      } catch (err) {
        console.error(err);
        status.textContent = `Gallery load error: ${err}`;
      }
    }

    // 초기 로드
    loadGallery();
  </script>

</body>

</html>
