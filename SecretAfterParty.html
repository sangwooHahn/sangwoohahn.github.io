<style>
  :root {
    --ticket-height: 700px;
  }

  html,
  body {
    overflow: hidden;
    height: 100%;
    touch-action: none;
    overscroll-behavior: none;
    background-color: #FFFAF1;
    z-index: -2;
  }

  .ticket-svg {
    position: fixed;
    width: 100%;
    max-width: 400px;
    height: auto;
    max-height: var(--ticket-height);
    display: block;
    margin: auto;
    filter: drop-shadow(0px 0px 5px rgba(0, 0, 0, 0.4));
  }

  header {
    height: calc(var(--vh) * 100);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0;
  }

  .ticket-title-text {
    color: #FFC23E;
    font-size: 100%;
  }

  .ticket-title-image {
    padding-top: 10px;
  }

  .ticket-title-image {
    width: 100%;
    height: auto;
    display: block;
  }

  .ticket-title-image path {
    fill: #FFC23E;
  }

  .dashed-line {
    position: absolute;
    border: none;
    width: calc(100% - 90px);
    max-width: calc(400px - 90px);
    height: 2px;
    bottom: 199px;
  }

  .graphic-box {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 50% 50%;
    width: calc(100% - 8px);
    aspect-ratio: 1 / 0.8;
    margin-top: 24px;
    min-height: 0;
    max-height: 100%;
    background: #F9C6C600;
    box-sizing: border-box;
  }

  .graphic-box img {
    position: relative;
    user-select: none;
    /* 텍스트 선택 방지 */
    -webkit-user-drag: none;
    /* Safari에서 이미지 드래그 방지 */
    -moz-user-select: none;
    -ms-user-select: none;
    user-drag: none;
    z-index: 2;
  }

  .graphic-box img:nth-of-type(1) {
    grid-column: 2;
    width: 105%;
    left: 60%;
    top: 5%;
  }

  .graphic-box img:nth-of-type(2) {
    grid-column: 5;
    width: 90%;
    left: -10%;
    top: -5%;
  }

  .graphic-box img:nth-of-type(3) {
    grid-column: 1;
    width: 90%;
    left: 50%;
    top: -45%;
  }

  .graphic-box img:nth-of-type(4) {
    grid-column: 3;
    width: 85%;
    left: 55%;
    top: -20%;
  }

  .graphic-box img:nth-of-type(5) {
    grid-column: 6;
    width: 150%;
    left: -75%;
    top: 12%;
  }


  .ticket-text {
    padding-top: 16px;
    color: white;
  }

  .ticket-content-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 100%;
    max-height: var(--ticket-height);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    /* overflow: hidden; */
    padding: 40px 48px;
    box-sizing: border-box;
    z-index: 1;
  }

  .scratch-container {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    margin: 0 auto;
    text-align: center;
    width: calc(100% - 32px - 64px);
    height: 136px;
    /* z-index: 1000; */
  }

  .scratch-container .prize,
  .scratch-container canvas {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 8px;
  }

  .prize {
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    font-size: large;
    gap: 8px;
  }

  /* 안내 텍스트 */
  .scratch-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-weight: bold;
    font-size: 18px;
    pointer-events: none;
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }

  .notification {
    background-color: rgba(240, 240, 240, 0.9);
    color: #222222;
    padding: 10px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    font-size: 14px;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.5s ease;
    pointer-events: auto;
  }

  .notification.show {
    opacity: 1;
    transform: translateX(0);
  }

  #cornerBtn {
    position: fixed;
    bottom: 10px;
    right: 16px;
    width: 16px;
    height: 16px;
    background-color: white;
    border-radius: 50%;
    cursor: pointer;
    z-index: 1000;
  }

  /* 모달 */
  #hiddenMissionsModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #modalContent {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 90%;
    max-width: 320px;
    background: #fff;
    padding: var(--padding-48);
    padding-bottom: var(--padding-36);
    border-radius: 12px;
    text-align: center;
    box-sizing: border-box;
    box-shadow: 0 0 32px rgba(0, 0, 0, 0.3);
  }

  #modalContent ul {
    width: 100%;
    list-style: none;
    padding: 24px;
    margin: 0 0 20px 0;
    font-size: 16px;
    background-color: var(--background-primary);
    border-radius: 16px;
  }

  #modalContent li {
    margin: 8px 0;
  }

  #closeModal {
    /* padding: 6px 16px;
    border: none;
    background-color: #333;
    color: white;
    border-radius: 6px;
    cursor: pointer;
     */
    padding: 12px var(--padding-24);
    max-width: 120px;
    width: 100%;
    font-weight: 300;
  }
</style>

  <script>
    // 0. 사용자 언어 감지
    function getUserLang() {
      // localStorage에 저장된 언어 확인
      let storedLang = localStorage.getItem("lang");

      if (!storedLang) {
        // 없으면 브라우저 언어 감지 후 저장
        const lang = navigator.language.toLowerCase();
        storedLang = lang.startsWith("ko") ? "KR" : "EN";
        localStorage.setItem("lang", storedLang);
      }

      return storedLang;
    }


    // 1. 구글 시트 데이터 불러오기
    async function fetchSheetData() {
      const sheetUrl = "https://docs.google.com/spreadsheets/d/1C_G5IezKbH6oyfxZtZK853zgnKhIL7we1jiZerd2mmo/gviz/tq?tqx=out:json";
      const res = await fetch(sheetUrl);
      const text = await res.text();
      const json = JSON.parse(text.substr(47).slice(0, -2));
      return json.table.rows;
    }

    // 2. 텍스트맵 만들기
    async function buildTextMap(lang) {
      const rows = await fetchSheetData();
      const textMap = {};
      rows.forEach(row => {
        const key = row.c[0]?.v;
        const krText = row.c[1]?.v;
        const enText = row.c[2]?.v;
        textMap[key] = (lang === "KR" ? krText : enText) || "";
      });
      return textMap;
    }

    // 3. 텍스트 적용
    function applyAllTexts(textMap) {
      // 일반 텍스트 적용
      document.querySelectorAll("[data-key]").forEach(el => {
        const key = el.getAttribute("data-key");
        const text = textMap[key] || "";
        el.innerHTML = text.replace(/\n/g, "<br>");
      });
    }

    // 4. 언어별 테마
    function applyLanguageTheme(lang) {
      const body = document.body;
      body.classList.remove("Language-Korean", "Language-English");
      body.classList.add(lang === "KR" ? "Language-Korean" : "Language-English");
    }

    // ----------------------
    // 6. 탭 기본값 설정 및 클릭 처리 (모듈 전용)
    // ----------------------
    document.addEventListener('DOMContentLoaded', async () => {
      const lang = getUserLang();
      applyLanguageTheme(lang);
      const textMap = await buildTextMap(lang);
      window.textMap = textMap;
      applyAllTexts(textMap);
    });



    //----티켓 배경----//

    function createDiagonalPattern() {
      const pCanvas = document.createElement('canvas');

      const size = 24;
      pCanvas.width = size;
      pCanvas.height = size;

      pCtx.fillStyle = '#CCCCCC';
      pCtx.fillRect(0, 0, size, size);

      pCtx.strokeStyle = '#C4C4C4';
      pCtx.lineWidth = 8;

      pCtx.beginPath();
      pCtx.moveTo(-size, size + size * 0.5);
      pCtx.lineTo(size + size * 0.5, -size);
      pCtx.stroke();

      pCtx.beginPath();
      pCtx.moveTo(-size * 0.5, size * 2);
      pCtx.lineTo(size * 2, -size * 0.5);
      pCtx.stroke();

      return ctx.createPattern(pCanvas, 'repeat');

    // ---- 긁기 관련 변수 ---- //
    let isDrawing = false;

    // ---- 스크롤 차단 ---- //

    // ---- 자연스러운 긁기 ---- //
    function scratchAt(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,1)';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 2;

      if (prevX !== null && prevY !== null) {
        const dx = x - prevX;
        const dy = y - prevY;
        const dist = Math.hypot(dx, dy);

        for (let i = 0; i < dist; i += step) {
          const px = prevX + dx * (i / dist) + (Math.random() * 2 - 1);
          const py = prevY + dy * (i / dist) + (Math.random() * 2 - 1);

          ctx.beginPath();
          ctx.arc(px, py, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalAlpha = 0.6;
          ctx.beginPath();
          ctx.arc(px + Math.random() * 2, py + Math.random() * 2, radius * (0.7 + Math.random() * 0.3), 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      // 마지막 점 찍기
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      prevX = x;
      prevY = y;
      ctx.shadowBlur = 0;

      // 흔들기 기능

    //스크래치율 계산
    function getScratchPercent(canvas) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      let transparent = 0;
      const total = imgData.length / 4;

      for (let i = 0; i < imgData.length; i += 4) {
        if (imgData[i + 3] === 0) transparent++;
      }

      return (transparent / total) * 100;

      if (el.isShaking) return;

      el.style.transformOrigin = "50% 100%";

      const direction = Math.random() < 0.5 ? 1 : -1;
      const maxTilt = 1 + Math.random() * 5; // 5~10deg
      const frames = 20;
      let frame = 0;

      function animate() {
        // ❗ 강제 종료 요청 시 즉시 정리하고 끝냄
        if (el.shakeCancel) {
          el.angle = 0;
          el.isShaking = false;
          applyTransform(el);
          return;
        }

        frame++;
        const progress = frame / frames;
        const angle = Math.sin(progress * Math.PI * 2) * maxTilt * (1 - progress) * direction;
        el.style.transform = `rotate(${angle}deg)`;

        if (frame < frames) requestAnimationFrame(animate);
        else {
          el.style.transform = "";
          el.isShaking = false;
        }
      }

      animate();

    /* ----공통 드래그 핸들러---- */
    function enableDraggable(el, onMove, onUp) {
      let isDown = false;
      let startX = 0, startY = 0;

      const down = e => {
        isDown = true;
        const t = e.touches ? e.touches[0] : e;
        startX = t.clientX;
        startY = t.clientY;
        el.style.transition = 'none';
      };

      const move = e => {
        if (!isDown) return;
        const t = e.touches ? e.touches[0] : e;
        onMove(t.clientX - startX, t.clientY - startY, t);
      };

      const up = () => {
        if (!isDown) return;
        isDown = false;
        onUp();
      };

      el.addEventListener("mousedown", down);
      el.addEventListener("touchstart", down);

      window.addEventListener("mousemove", move);
      window.addEventListener("touchmove", move);

      window.addEventListener("mouseup", up);
      window.addEventListener("touchend", up);

            ctx.fill();
          } else {

            ctx.translate(c.x, c.y);
            ctx.rotate(c.rotation);
            ctx.fillRect(-c.r, -c.r / 2, c.r * 2, c.r);
            ctx.restore();
          }

        requestAnimationFrame(animate);

    // JS
    //----- Notification Manager -----
    class NotificationManager {
      constructor(maxVisible = 3, duration = 4000) {
        this.container = document.getElementById('notification-container');
        this.maxVisible = maxVisible;
        this.duration = duration;
        this.queue = [];
        this.active = [];
      }

      show(message) {
        const notification = document.createElement('div');
        notification.className = 'notification';
        notification.textContent = message;

        if (this.active.length >= this.maxVisible) {
          this.queue.push(notification);
        } else {
          this._display(notification);
        }
      }

      _display(notification) {
        this.container.appendChild(notification);
        this.active.push(notification);
        requestAnimationFrame(() => {
          notification.style.opacity = '1';
          notification.style.transform = 'translateY(0)';
        });
        setTimeout(() => this._remove(notification), this.duration);
      }

      _remove(notification) {
        notification.style.opacity = '0';
        notification.addEventListener('transitionend', () => notification.remove(), { once: true });
        this.active = this.active.filter(n => n !== notification);
        if (this.queue.length > 0) this._display(this.queue.shift());
      }
    }

        if (mission.completed) {
          li.textContent = mission.text;
          li.style.color = "green"; // 클리어된 미션 색
        } else {
          li.textContent = mission.text.split("").map(c => c === " " ? " " : "?").join("");
          li.style.color = "black"; // 안 깬 미션 색
        }

        missionsList.appendChild(li);
      });
    }

    document.getElementById("cornerBtn").addEventListener("click", () => {
      renderMissions();
      modal.style.display = "flex";
    });

    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
      // 미션 체크
      missions.forEach(m => {
        if (m.id === 'CloseEasterEgg' && !m.completed) {
          updateMissionProgress(m.id, 1); // progress + 저장 + 알림까지 처리
        }
      });
    });

  </script>
